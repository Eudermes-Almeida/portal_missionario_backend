
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:portalmissionario123}
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/portalmissionario}
quarkus.hibernate-orm.database.generation=update

quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.query-timeout=300

quarkus.datasource.jdbc.idle-removal-interval=10
quarkus.datasource.jdbc.background-validation-interval=60

quarkus.hibernate-orm.query.plan-cache-max-size=512
quarkus.http.host=0.0.0.0

# Transação
quarkus.transaction-manager.timeout=300

# Habilita o log das consultas SQL geradas pelo Hibernate
quarkus.hibernate-orm.log.sql=true

# Habilita o log dos parâmetros das consultas SQL
quarkus.hibernate-orm.log.bind-parameters=true

# Configurações do servidor
quarkus.http.port=${PORT:8086}
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Quarkus Mailer -- SMTP relay do Brevo (fase de testes, ver memoria do projeto: sem dominio
# proprio verificado ainda, verificacao de remetente unico via Gmail). Credenciais NUNCA
# hardcoded aqui -- vem de variavel de ambiente (.env local, gitignored, ou env do Render em
# producao). Username/password sem valor default de proposito: se nao configurado, o Mailer
# falha alto (erro de auth SMTP) em vez de silenciosamente tentar enviar sem credencial.
quarkus.mailer.host=smtp-relay.brevo.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${BREVO_SMTP_USERNAME}
quarkus.mailer.password=${BREVO_SMTP_PASSWORD}
quarkus.mailer.from=${MAILER_FROM:eudermes11@gmail.com}

# Gotcha do Quarkus Mailer: em "quarkus:dev" o mock vem TRUE por padrao (o send() so simula o
# envio, sem tocar o SMTP de verdade -- por isso o Brevo mostrava 0 logs mesmo com a API
# respondendo 204). Desligado explicitamente pra sempre enviar de verdade, dev ou prod.
quarkus.mailer.mock=false

# Supabase Storage -- galeria de fotos do missionario (bucket ja usado pra foto de perfil,
# "linkfoto"). Upload sempre passa pelo backend (nunca direto do Angular pro Supabase, decisao
# explicita de arquitetura); a service_role key AUTORIZA GRAVACAO NO BUCKET INTEIRO e por isso
# so vem de variavel de ambiente (.env local gitignored, ou env do Render em producao) -- mesmo
# padrao das credenciais do Brevo.
#
# Gotcha (diferente do Mailer): uma @ConfigProperty String SEM default faz o Quarkus falhar o
# app inteiro NO STARTUP se a env var nao existir (nao so no primeiro uso da feature) --
# derrubou o dev mode inteiro na primeira vez, inclusive tentar um default vazio ("${VAR:}")
# ainda quebrava, porque o converter embutido do SmallRye trata string vazia como nula pra um
# campo String obrigatorio. Resolvido no lado do Java: o campo e Optional<String> (nao String
# puro), entao a ausencia da env var vira Optional.empty() sem derrubar nada -- o erro claro so
# aparece quando alguem realmente chama SupabaseStorageService.subir() sem a chave configurada.
## Projeto Supabase dedicado ("JovemSud", ref aeuafhdhwqnecciuqnt) -- DIFERENTE do projeto que
# hospeda "simplificaSudBucket" (esse ai e compartilhado com o RAIO_X_UNIDADE, ainda usado por
# dadosmissionarios.linkfoto -- migracao das fotos de perfil pra ca fica pra depois, decisao
# explicita do usuario, sao "dois projetos distintos").
supabase.storage.url=https://aeuafhdhwqneccciuqnt.supabase.co
supabase.storage.bucket=JovemSudBucket
supabase.storage.service-key=${SUPABASE_SERVICE_KEY:}

# Limite de tamanho do corpo da requisicao multipart. A compressao client-side (Canvas, no
# Angular) deve gerar ~250-350kb por foto -- 3M e uma margem de seguranca generosa contra
# bug/abuso (ex.: chamada direta na API sem passar pela compressao), nao um teto pensado pra
# caber a foto original de alta resolucao (essa nunca deveria trafegar ate aqui).
quarkus.http.limits.max-body-size=3M
